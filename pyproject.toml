[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-automation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cloakbrowser>=0.3.28",
    "pyyaml>=6.0",
]

[project.scripts]
cloak = "scripts.cloak:main"
linkedin-connect = "tasks.linkedin_connect.connect:main"
linkedin-connect-explore = "tasks.linkedin_connect.explore:main"
linkedin-search = "tasks.linkedin_search.search:main"
linkedin-search-explore = "tasks.linkedin_search.explore:main"
linkedin-profile = "tasks.linkedin_profile.scrape:main"
linkedin-profile-explore = "tasks.linkedin_profile.explore:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["lib", "scripts", "tasks"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
